<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769ff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <title>Profile — PeraGo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-page">
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-brand">
        <div class="app-brand-mark">P</div>
        <div><div class="app-brand-name">PeraGo</div><div class="app-brand-sub">Your smart wallet</div></div>
      </div>
      <a class="app-profile" href="profile.html" aria-label="Profile">P</a>
    </div>
  </header>

  <main class="page-content">
    <div class="page-title-row">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">‹</button>
      <div><h1 class="page-title">Profile</h1><p class="page-subtitle">Manage your account and security.</p></div>
    </div>

    <section class="app-card profile-hero">
      <div class="profile-avatar">P</div>
      <h1>PeraGo Wallet</h1>
      <p>Your account is protected.</p>
    </section>

    <section class="app-card">
      <div class="section-kicker" style="color:#8b99ad">ACCOUNT DETAILS</div>
      <div class="profile-info">
        <div class="profile-row">
          <span class="profile-label">Mobile Number</span>
          <span class="profile-value" id="phoneNumber">Loading...</span>
        </div>
        <div class="profile-row">
          <span class="profile-label">Account Status</span>
          <span class="profile-value">✓ Verified</span>
        </div>
      </div>
      <a class="action-link" href="change-pin.html">🔐 Change PIN</a>
      <button class="danger-btn full-btn" id="logoutBtn" type="button">Log out</button>
      <div id="profileMessage" class="auth-message"></div>
    </section>

    <div class="status-note" style="margin-top:13px">
      <span>🛡️</span><div><strong>Demo wallet security</strong> PeraGo is a demo project. Never enter real financial credentials or money.</div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" onclick="window.location.href='index.html'"><span>⌂</span><small>Home</small></button>
    <button class="nav-item" type="button" onclick="window.location.href='send-money.html'"><span>➤</span><small>Send</small></button>
    <button class="nav-item qr-main" type="button" onclick="window.location.href='qr.html'"><span>▦</span><small>QR</small></button>
    <button class="nav-item" type="button" onclick="window.location.href='index.html#transactions'"><span>◷</span><small>History</small></button>
    <button class="nav-item active" type="button"><span>●</span><small>Profile</small></button>
  </nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signOut } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import { getFirestore,doc,getDoc } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const phoneNumber=document.getElementById("phoneNumber"),logoutBtn=document.getElementById("logoutBtn"),message=document.getElementById("profileMessage");
onAuthStateChanged(auth,user=>{
  if(!user){window.location.replace("register.html");return;}
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    const data=snap.exists()?snap.data():{};
    phoneNumber.textContent=data.phone||user.phoneNumber||"Mobile number unavailable";
  }catch(error){
    console.error("Profile load error:",error);
    phoneNumber.textContent=user.phoneNumber||"Mobile number unavailable";
  }
});
logoutBtn.addEventListener("click",async()=>{
  logoutBtn.disabled=true;message.textContent="Logging out...";
  try{await signOut(auth);sessionStorage.removeItem("perago_unlocked");window.location.replace("register.html");}
  catch(error){console.error(error);message.textContent="Logout failed.";logoutBtn.disabled=false;}
});
</script>
</body>
</html>
