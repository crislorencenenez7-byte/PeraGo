name: PeraGo Auto Update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch staging
        run: git fetch origin staging

      - name: Check update schedule
        id: schedule
        shell: bash
        run: |
          git show origin/staging:update-schedule.json > /tmp/update-schedule.json

          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("/tmp/update-schedule.json", "r", encoding="utf-8") as f:
              config = json.load(f)["update"]

          scheduled = datetime.fromisoformat(
              f"{config['date']}T{config['time']}:00"
          ).replace(tzinfo=ZoneInfo(config["timezone"]))

          now = datetime.now(ZoneInfo(config["timezone"]))

          print("Scheduled:", scheduled)
          print("Current:", now)

          result = "true" if now >= scheduled else "false"

          with open("/tmp/should_update", "w") as f:
              f.write(result)

          print("Should update:", result)
          PY

          echo "should_update=$(cat /tmp/should_update)" >> "$GITHUB_OUTPUT"

      - name: Promote staging to main
        if: steps.schedule.outputs.should_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git restore --source=origin/staging -- \
            . \
            ':!.github/workflows/auto-update.yml'

          git add .

          git commit -m "Promote scheduled staging update" || echo "No changes to commit."

          git push origin main
