name: PeraGo Auto Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Check update schedule
        id: schedule
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open("update-schedule.json", "r") as f:
              config = json.load(f)["update"]

          scheduled = datetime.fromisoformat(
              f"{config['date']}T{config['time']}:00"
          ).replace(tzinfo=ZoneInfo(config["timezone"]))

          now = datetime.now(ZoneInfo(config["timezone"]))

          print("Scheduled:", scheduled)
          print("Current:", now)

          if now >= scheduled:
              with open("/tmp/should_update", "w") as f:
                  f.write("true")
              print("Update time reached.")
          else:
              with open("/tmp/should_update", "w") as f:
                  f.write("false")
              print("Not yet time.")
          PY

          echo "should_update=$(cat /tmp/should_update)" >> "$GITHUB_OUTPUT"

      - name: Promote staging to main
        if: steps.schedule.outputs.should_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main staging
          git checkout -B main origin/main
          git restore --source=origin/staging -- . ':!.github/workflows/auto-update.yml'
          git add .
          git commit -m "Promote scheduled staging update" || true
          git push origin main
