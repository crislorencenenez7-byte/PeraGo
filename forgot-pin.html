<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1264e8">
  <title>Forgot PIN - PeraGo</title>
  <link rel="stylesheet" href="auth.css">

  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: #f4f7fb;
    }

    .recovery-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .recovery-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .back-link {
      color: #1264e8;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 20px;
    }

    .recovery-card h2 {
      margin: 0;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 22px;
    }

    .otp-section {
      display: none;
      margin-top: 20px;
    }

    .otp-input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
    }

    .otp-input:focus {
      border-color: #1264e8;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>

<main class="recovery-page">

    <section class="recovery-card">

      <a class="back-link" href="pin-lock.html">← Back</a>

      <div class="auth-heading">
        <h2>Forgot PIN</h2>
        <p class="subtitle">
          Verify your PeraGo email with a secure sign-in link,
          then create a new 4-digit PIN.
        </p>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          class="otp-input"
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          style="letter-spacing:0;font-size:16px;text-align:left;"
        >
      </div>

      <button class="primary-btn" id="sendResetBtn" type="button">
        Send Reset Link
      </button>

      <div class="message" id="message"></div>

    </section>

  </main>

  <script type="module">
    import "./firebase-auth.js";

    const emailInput = document.getElementById("email");
    const sendBtn = document.getElementById("sendResetBtn");
    const message = document.getElementById("message");

    sendBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent = "Enter your email address.";
        message.style.color = "#dc2626";
        return;
      }

      sendBtn.disabled = true;
      message.textContent = "Sending reset link...";
      message.style.color = "#64748b";

      const result = await window.sendPinResetLink(email);

      if (result.success) {
        message.textContent = "Reset link sent. Check your email and open the link on this device.";
        message.style.color = "#16a34a";
      } else {
        message.textContent = result.message;
        message.style.color = "#dc2626";
        sendBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
