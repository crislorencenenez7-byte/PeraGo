<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1264e8">
  <title>Forgot PIN - PeraGo</title>
  <link rel="stylesheet" href="auth.css">

  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      background: #f4f7fb;
    }

    .recovery-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .recovery-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 28px;
      padding: 28px 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .back-link {
      color: #1264e8;
      text-decoration: none;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 20px;
    }

    .recovery-card h2 {
      margin: 0;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      line-height: 1.5;
      margin: 8px 0 22px;
    }

    .otp-section {
      display: none;
      margin-top: 20px;
    }

    .otp-input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border: 1px solid #dbe3ef;
      border-radius: 14px;
      font-size: 22px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
    }

    .otp-input:focus {
      border-color: #1264e8;
    }

    .message {
      min-height: 22px;
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <main class="recovery-page">

    <section class="recovery-card">

      <a class="back-link" href="pin-lock.html">← Back</a>

      <div class="auth-heading">
        <h2>Forgot PIN</h2>
        <p class="subtitle">
          Verify your PeraGo mobile number with an OTP,
          then create a new 6-digit PIN.
        </p>
      </div>

      <div class="input-group">
        <label for="phone">Mobile Number</label>
        <input
          class="otp-input"
          type="tel"
          id="phone"
          placeholder="9XXXXXXXXX"
          inputmode="numeric"
          autocomplete="tel"
          style="letter-spacing:1px;font-size:18px;"
        >
      </div>

      <div id="recaptcha-container"></div>

      <button class="primary-btn" id="sendOtpBtn" type="button">
        Send OTP
      </button>

      <div class="otp-section" id="otpSection">

        <div class="input-group">
          <label for="otp">Verification Code</label>

          <input
            class="otp-input"
            type="text"
            id="otp"
            maxlength="6"
            placeholder="000000"
            inputmode="numeric"
            autocomplete="one-time-code"
          >
        </div>

        <button class="primary-btn" id="verifyOtpBtn" type="button">
          Verify OTP
        </button>

      </div>

      <div class="message" id="message"></div>

    </section>

  </main>

  <script type="module">

    import "./firebase-auth.js";

    const phoneInput = document.getElementById("phone");
    const otpInput = document.getElementById("otp");

    const sendBtn = document.getElementById("sendOtpBtn");
    const verifyBtn = document.getElementById("verifyOtpBtn");

    const otpSection = document.getElementById("otpSection");
    const message = document.getElementById("message");

    sendBtn.addEventListener("click", async () => {

      const phone = phoneInput.value.trim();

      if (!phone) {
        message.textContent = "Enter your mobile number.";
        message.style.color = "#dc2626";
        return;
      }

      sendBtn.disabled = true;
      message.textContent = "Sending OTP...";
      message.style.color = "#64748b";

      const result = await window.sendOTP(phone);

      if (result.success) {

        message.textContent = "OTP sent. Check your SMS.";
        message.style.color = "#16a34a";

        otpSection.style.display = "block";

        otpInput.focus();

      } else {

        message.textContent = result.message;
        message.style.color = "#dc2626";

        sendBtn.disabled = false;

      }

    });

    verifyBtn.addEventListener("click", async () => {

      const otp = otpInput.value.trim();

      if (!/^\d{6}$/.test(otp)) {
        message.textContent = "Enter the 6-digit OTP.";
        message.style.color = "#dc2626";
        return;
      }

      verifyBtn.disabled = true;
      message.textContent = "Verifying...";
      message.style.color = "#64748b";

      const result = await window.verifyOTP(otp);

      if (result.success) {

        message.textContent = "Phone verified!";
        message.style.color = "#16a34a";

        setTimeout(() => {
          window.location.href = "reset-pin.html";
        }, 500);

      } else {

        message.textContent =
          "Verification failed: " + result.message;

        message.style.color = "#dc2626";

        verifyBtn.disabled = false;

      }

    });

  </script>

<script type="module" src="update-timer.js"></script>
</body>
</html>
