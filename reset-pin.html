<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1264e8">
  <title>Set New PIN - PeraGo</title>
  <link rel="stylesheet" href="auth.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: #f4f7fb;
    }

    .reset-page {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }

    .reset-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 28px;
      padding: 28px 20px 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    .reset-card h2 {
      margin: 0;
      font-size: 22px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin: 8px 0 22px;
      line-height: 1.5;
    }

    .step-title {
      color: #1264e8;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 13px;
      margin: 18px 0 24px;
    }

    .pin-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #dbe3ef;
      transition: .15s ease;
    }

    .pin-dot.filled {
      background: #1264e8;
      transform: scale(1.05);
    }

    .message {
      min-height: 22px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }

    .key {
      height: 62px;
      border: 0;
      border-radius: 18px;
      background: #f4f7fb;
      color: #172033;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key:active {
      transform: scale(.94);
      background: #e7eefb;
    }

    .zero {
      grid-column: 2;
    }

    .delete {
      grid-column: 3;
      background: transparent;
      color: #1264e8;
      font-size: 24px;
    }

    .delete:active {
      background: #eef5ff;
    }
  </style>
</head>

<body>

  <main class="reset-page">

    <section class="reset-card">

      <div class="auth-brand">
        <div class="brand-icon" style="margin:0 auto 12px;">P</div>
      </div>

      <h2 id="title">Create New PIN</h2>

      <p class="subtitle" id="subtitle">
        Choose a new 6-digit PIN for your PeraGo wallet.
      </p>

      <div class="step-title" id="stepTitle">
        Enter New PIN
      </div>

      <div class="pin-dots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div class="message" id="message"></div>

      <div class="keypad">

        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>

        <button class="key zero" data-key="0">0</button>

        <button class="key delete" id="deleteBtn" type="button">
          ⌫
        </button>

      </div>

    </section>

  </main>

  <script type="module">

    import { savePin } from "./pin.js";

    let enteredPin = "";
    let firstPin = "";
    let confirming = false;
    let locked = false;

    const dots = document.querySelectorAll(".pin-dot");
    const message = document.getElementById("message");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const stepTitle = document.getElementById("stepTitle");
    const deleteBtn = document.getElementById("deleteBtn");

    function updateDots() {

      dots.forEach((dot, index) => {
        dot.classList.toggle(
          "filled",
          index < enteredPin.length
        );
      });

    }

    function resetInput() {
      enteredPin = "";
      updateDots();
    }

    async function processPin() {

      if (enteredPin.length !== 6 || locked) {
        return;
      }

      if (!confirming) {

        firstPin = enteredPin;

        confirming = true;
        resetInput();

        title.textContent = "Confirm New PIN";

        subtitle.textContent =
          "Enter your new PIN again to confirm.";

        stepTitle.textContent =
          "Confirm PIN";

        message.textContent = "";

        return;
      }

      if (enteredPin !== firstPin) {

        message.style.color = "#dc2626";
        message.textContent =
          "PINs do not match. Try again.";

        firstPin = "";
        confirming = false;

        resetInput();

        title.textContent = "Create New PIN";

        subtitle.textContent =
          "Choose a new 6-digit PIN for your PeraGo wallet.";

        stepTitle.textContent =
          "Enter New PIN";

        return;
      }

      locked = true;

      try {
        await savePin(enteredPin);
      } catch (error) {
        console.error(error);
        message.textContent = "Failed to save PIN. Please try again.";
        locked = false;
        return;
      }

      sessionStorage.setItem(
        "perago_unlocked",
        "true"
      );

      message.style.color = "#16a34a";
      message.textContent =
        "PIN changed successfully!";

      setTimeout(() => {
        window.location.href = "pin-lock.html";
      }, 700);

    }

    document.querySelectorAll("[data-key]").forEach(button => {

      button.addEventListener("click", () => {

        if (enteredPin.length >= 6 || locked) {
          return;
        }

        enteredPin += button.dataset.key;

        message.textContent = "";

        updateDots();

        if (enteredPin.length === 6) {
          setTimeout(processPin, 150);
        }

      });

    });

    deleteBtn.addEventListener("click", () => {

      if (enteredPin.length > 0 && !locked) {

        enteredPin =
          enteredPin.slice(0, -1);

        message.textContent = "";

        updateDots();

      }

    });

  </script>

<script type="module" src="update-timer.js"></script>
</body>
</html>
