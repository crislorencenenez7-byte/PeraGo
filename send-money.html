<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Send Money - PeraGo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <main class="page">

    <header class="page-header">
      <button
        type="button"
        onclick="history.back()"
        class="back-btn"
      >
        ←
      </button>

      <h1>Send Money</h1>
    </header>

    <section id="formSection" class="card">

      <div class="input-group">
        <label for="recipient">
          Recipient Mobile Number
        </label>

        <input
          id="recipient"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="09XXXXXXXXX"
        >

        <small>
          Enter the mobile number registered with PeraGo.
        </small>
      </div>

      <div class="input-group">
        <label for="amount">
          Amount
        </label>

        <input
          id="amount"
          type="number"
          inputmode="decimal"
          min="1"
          step="0.01"
          placeholder="0.00"
        >
      </div>

      <button
        id="continueBtn"
        type="button"
        class="primary-btn"
        disabled
      >
        Continue
      </button>

    </section>

    <section
      id="confirmBox"
      class="card"
      style="display:none;"
    >

      <h2>Confirm Transfer</h2>

      <div class="confirm-row">
        <span>Recipient</span>
        <strong id="confirmRecipient">—</strong>
      </div>

      <div class="confirm-row">
        <span>Amount</span>
        <strong id="confirmAmount">₱0.00</strong>
      </div>

      <div class="confirm-row">
        <span>Available Balance</span>
        <strong id="confirmBalance">₱0.00</strong>
      </div>

      <div class="confirm-actions">

        <button
          id="cancelBtn"
          type="button"
          class="secondary-btn"
        >
          Cancel
        </button>

        <button
          id="confirmBtn"
          type="button"
          class="primary-btn"
        >
          Confirm Transfer
        </button>

      </div>

    </section>

    <div
      id="sendMessage"
      class="auth-message"
    ></div>

  </main>

  <script type="module">

    import {
      auth,
      findWalletByPhone,
      getCurrentWallet,
      createTransferRequest,
      formatPeso
    } from "./wallet-firestore.js";

    import { addTransaction } from "./wallet.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const recipientInput =
      document.getElementById("recipient");

    const amountInput =
      document.getElementById("amount");

    const formSection =
      document.getElementById("formSection");

    const confirmBox =
      document.getElementById("confirmBox");

    const continueBtn =
      document.getElementById("continueBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const confirmBtn =
      document.getElementById("confirmBtn");

    const confirmRecipient =
      document.getElementById("confirmRecipient");

    const confirmAmount =
      document.getElementById("confirmAmount");

    const confirmBalance =
      document.getElementById("confirmBalance");

    const message =
      document.getElementById("sendMessage");

    let currentUser = null;
    let recipientWallet = null;
    let normalizedRecipient = "";
    let transferLocked = false;

    function normalizePhone(phone) {
      let value = String(phone || "")
        .trim()
        .replace(/[^0-9+]/g, "");

      if (value.startsWith("09") && value.length === 11) {
        return "+63" + value.substring(1);
      }

      if (value.startsWith("9") && value.length === 10) {
        return "+63" + value;
      }

      if (value.startsWith("639") && value.length === 12) {
        return "+" + value;
      }

      if (value.startsWith("+639") && value.length === 13) {
        return value;
      }

      return null;
    }

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (!user) {
        window.location.replace("pin-lock.html");
        return;
      }

      continueBtn.disabled = false;
    });

    continueBtn.addEventListener("click", async () => {

      if (!currentUser) {
        message.textContent =
          "Please wait for your account to load.";
        return;
      }

      if (transferLocked) {
        return;
      }

      const recipient =
        recipientInput.value.trim();

      const amount =
        Number(amountInput.value);

      normalizedRecipient =
        normalizePhone(recipient);

      if (!normalizedRecipient) {
        message.textContent =
          "Enter a valid Philippine mobile number.";
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        message.textContent =
          "Enter a valid amount.";
        return;
      }

      continueBtn.disabled = true;
      continueBtn.textContent = "Checking...";
      message.textContent = "";

      try {

        const wallet =
          await getCurrentWallet();

        const balance =
          Number(wallet.balance);

        if (!Number.isFinite(balance)) {
          throw new Error(
            "Your wallet balance is invalid."
          );
        }

        if (amount > balance) {
          throw new Error(
            `Insufficient balance. Available: ${formatPeso(balance)}`
          );
        }

        recipientWallet =
          await findWalletByPhone(
            normalizedRecipient
          );

        if (!recipientWallet) {
          throw new Error(
            "No PeraGo account was found for this mobile number."
          );
        }

        if (
          recipientWallet.uid ===
          currentUser.uid
        ) {
          throw new Error(
            "You cannot send money to yourself."
          );
        }

        confirmRecipient.innerHTML =
          `<span style="display:block;">${recipientWallet.name || "Unknown User"}</span>` +
          `<small style="display:block;margin-top:4px;color:#64748b;">${recipientWallet.phone || normalizedRecipient}</small>`;

        confirmAmount.textContent =
          formatPeso(amount);

        confirmBalance.textContent =
          formatPeso(balance);

        formSection.style.display = "none";
        confirmBox.style.display = "block";

      } catch (error) {

        console.error("FULL TRANSFER ERROR:", error.code, error.message, error); console.error(
          "Send Money error:",
          error
        );

        message.textContent =
          error.message ||
          "Unable to continue.";

      } finally {

        continueBtn.disabled = false;
        continueBtn.textContent = "Continue";

      }
    });

    cancelBtn.addEventListener("click", () => {

      if (transferLocked) {
        return;
      }

      confirmBox.style.display = "none";
      formSection.style.display = "block";

      recipientWallet = null;
      message.textContent = "";

    });

    confirmBtn.addEventListener("click", async () => {

      if (transferLocked) {
        return;
      }

      if (!recipientWallet) {
        message.textContent =
          "Recipient account not found.";
        return;
      }

      transferLocked = true;

      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = "Processing...";

      const amount =
        Number(amountInput.value);

      try {

        const requestId =
          await createTransferRequest(
            recipientWallet.uid,
            amount,
            normalizedRecipient
          );

        console.log(
          "Transfer request ID:",
          requestId
        );

        addTransaction({
          direction: "out",
          type: "send",
          title: "Sent Money",
          recipient: recipientWallet.name || recipientWallet.phone || normalizedRecipient,
          amount
        });

        confirmBtn.textContent =
          "✓ Request Sent";

        confirmBtn.style.background =
          "#16a34a";

        message.textContent =
          "Transfer request created successfully.";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

      } catch (error) {

        console.error("FULL TRANSFER ERROR:", error.code, error.message, error); console.error(
          "Transfer request error:",
          error
        );

        transferLocked = false;

        confirmBtn.disabled = false;
        cancelBtn.disabled = false;

        confirmBtn.textContent =
          "Confirm Transfer";

        message.textContent =
          error.message ||
          "Transfer request failed.";
      }
    });

  </script>

<script type="module" src="update-timer.js"></script>
</body>
</html>
