<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Money - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    body { background:#f4f7fb; }
    .back-link {
      display:inline-block;
      margin-bottom:18px;
      color:#1677ff;
      text-decoration:none;
      font-weight:600;
    }
    .amount-input {
      width:100%;
      box-sizing:border-box;
      padding:16px;
      border:1px solid #dbe3ef;
      border-radius:12px;
      font-size:24px;
      font-weight:700;
      text-align:center;
      outline:none;
    }
    .amount-input:focus { border-color:#1677ff; }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Demo Wallet</p>
    </div>

    <div class="auth-card">
      <a class="back-link" href="index.html">← Back to Home</a>

      <div class="auth-heading">
        <h2>Send Money</h2>
        <p>Send demo funds to another mobile number.</p>
      </div>

      <div class="input-group">
        <label for="recipient">Recipient Mobile Number</label>
        <input
          type="tel"
          id="recipient"
          placeholder="9XXXXXXXXX"
          inputmode="numeric"
        >
      </div>

      <div class="input-group">
        <label for="amount">Amount</label>
        <input
          class="amount-input"
          type="number"
          id="amount"
          min="1"
          step="0.01"
          inputmode="decimal"
          placeholder="0.00"
        >
      </div>

      <button class="primary-btn" id="sendBtn" type="button">
        Send Demo Money
      </button>

      <div id="sendMessage" class="auth-message"></div>
    </div>

    <p class="footer-text">Demo only — no real money is sent.</p>
  </div>

  <script type="module">
    import {
      getBalance,
      setBalance,
      addTransaction,
      formatPeso
    } from "./wallet.js";

    const recipientInput = document.getElementById("recipient");
    const amountInput = document.getElementById("amount");
    const sendBtn = document.getElementById("sendBtn");
    const message = document.getElementById("sendMessage");

    sendBtn.addEventListener("click", () => {
      const recipient = recipientInput.value.trim();
      const amount = Number(amountInput.value);
      const balance = getBalance();

      if (!/^9\d{9}$/.test(recipient)) {
        message.textContent = "Enter a valid Philippine mobile number.";
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        message.textContent = "Enter a valid amount.";
        return;
      }

      if (amount > balance) {
        message.textContent =
          "Insufficient balance. Available: " + formatPeso(balance);
        return;
      }

      setBalance(balance - amount);

      addTransaction({
        type: "send",
        title: "Send Money",
        amount: amount,
        direction: "out",
        recipient: "+63" + recipient
      });

      message.textContent =
        "Sent " + formatPeso(amount) + " to +63" + recipient + ".";

      recipientInput.value = "";
      amountInput.value = "";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    });
  </script>
</body>
</html>
