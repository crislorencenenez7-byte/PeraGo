<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Send Money - PeraGo</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

<style id="perago-premium-1750">
:root{
  --pg-bg:#f4f7fb;--pg-card:#ffffff;--pg-text:#101828;--pg-muted:#667085;
  --pg-border:#e7ecf3;--pg-accent:#0b6bff;--pg-accent2:#13a8ff;
  --pg-shadow:0 14px 40px rgba(16,24,40,.08);
}
body{background:var(--pg-bg)!important;color:var(--pg-text)!important;}
.pg-brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;margin:0 0 18px;border-radius:20px;background:linear-gradient(135deg,#0b6bff,#13a8ff);color:#fff;box-shadow:0 12px 30px rgba(11,107,255,.20)}
.pg-brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px}
.pg-logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:21px}
.pg-brand small{display:block;font-weight:500;opacity:.82;font-size:11px;margin-top:1px}
.pg-profile-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b6bff;font-weight:800;text-decoration:none}
.pg-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;margin:16px 0 22px;border:1px solid var(--pg-border);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--pg-shadow)}
.pg-tab{min-height:58px;border-radius:16px;text-decoration:none;color:var(--pg-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;transition:.18s}
.pg-tab:hover{background:#f1f6ff;color:#0b6bff}
.pg-tab-icon{font-size:20px;line-height:1;font-weight:900}
.pg-tab[href="__CURRENT__"]{background:#eaf2ff;color:#0b6bff}
.pg-page-title{font-weight:900;letter-spacing:-.4px}
.pg-section-card{background:var(--pg-card);border:1px solid var(--pg-border);border-radius:24px;box-shadow:var(--pg-shadow)}
@media(max-width:520px){.pg-brandbar{padding:12px 14px}.pg-nav{gap:5px;padding:7px}.pg-tab{min-height:54px}.pg-tab-icon{font-size:18px}}
</style>

<div class="pg-brandbar">
  <div class="pg-brand">
    <div class="pg-logo">₱</div>
    <div>PeraGo<small>Your smart wallet</small></div>
  </div>
  <a class="pg-profile-dot" href="profile.html" aria-label="Profile">P</a>
</div>
<nav class="pg-nav" aria-label="PeraGo navigation">
  <a class="pg-tab" href="index.html" aria-label="Home"><span class="pg-tab-icon">⌂</span><span>Home</span></a><a class="pg-tab" href="send-money.html" aria-label="Send"><span class="pg-tab-icon">↗</span><span>Send</span></a><a class="pg-tab" href="qr.html" aria-label="QR"><span class="pg-tab-icon">▣</span><span>QR</span></a><a class="pg-tab" href="profile.html" aria-label="Profile"><span class="pg-tab-icon">◉</span><span>Profile</span></a>
</nav>


  <main class="page">

    <header class="page-header">
      <button
        type="button"
        onclick="history.back()"
        class="back-btn"
      >
        ←
      </button>

      <h1>Send Money</h1>
    </header>

    <section id="formSection" class="card">

      <div class="input-group">
        <label for="recipient">
          Recipient Mobile Number
        </label>

        <input
          id="recipient"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="09XXXXXXXXX"
        >

        <small>
          Enter the mobile number registered with PeraGo.
        </small>
      </div>

      <div class="input-group">
        <label for="amount">
          Amount
        </label>

        <input
          id="amount"
          type="number"
          inputmode="decimal"
          min="1"
          step="0.01"
          placeholder="0.00"
        >
      </div>

      <button
        id="continueBtn"
        type="button"
        class="primary-btn"
        disabled
      >
        Continue
      </button>

    </section>

    <section
      id="confirmBox"
      class="card"
      style="display:none;"
    >

      <h2>Confirm Transfer</h2>

      <div class="confirm-row">
        <span>Recipient</span>
        <strong id="confirmRecipient">—</strong>
      </div>

      <div class="confirm-row">
        <span>Amount</span>
        <strong id="confirmAmount">₱0.00</strong>
      </div>

      <div class="confirm-row">
        <span>Available Balance</span>
        <strong id="confirmBalance">₱0.00</strong>
      </div>

      <div class="confirm-actions">

        <button
          id="cancelBtn"
          type="button"
          class="secondary-btn"
        >
          Cancel
        </button>

        <button
          id="confirmBtn"
          type="button"
          class="primary-btn"
        >
          Confirm Transfer
        </button>

      </div>

    </section>

    <div
      id="sendMessage"
      class="auth-message"
    ></div>

  </main>

  <script type="module">

    import {
      auth,
      findWalletByPhone,
      getCurrentWallet,
      createTransferRequest,
      formatPeso,
      normalizePhone
    } from "./wallet-firestore.js";

    import { addTransaction } from "./wallet.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const recipientInput =
      document.getElementById("recipient");

    const amountInput =
      document.getElementById("amount");

    const formSection =
      document.getElementById("formSection");

    const confirmBox =
      document.getElementById("confirmBox");

    const continueBtn =
      document.getElementById("continueBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");

    const confirmBtn =
      document.getElementById("confirmBtn");

    const confirmRecipient =
      document.getElementById("confirmRecipient");

    const confirmAmount =
      document.getElementById("confirmAmount");

    const confirmBalance =
      document.getElementById("confirmBalance");

    const message =
      document.getElementById("sendMessage");

    let currentUser = null;
    let recipientWallet = null;
    let normalizedRecipient = "";
    let transferLocked = false;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (!user) {
        window.location.replace("pin-lock.html");
        return;
      }

      continueBtn.disabled = false;
    });

    continueBtn.addEventListener("click", async () => {

      if (!currentUser) {
        message.textContent =
          "Please wait for your account to load.";
        return;
      }

      if (transferLocked) {
        return;
      }

      const recipient =
        recipientInput.value.trim();

      const amount =
        Number(amountInput.value);

      normalizedRecipient =
        normalizePhone(recipient);

      if (!normalizedRecipient) {
        message.textContent =
          "Enter a valid Philippine mobile number.";
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        message.textContent =
          "Enter a valid amount.";
        return;
      }

      continueBtn.disabled = true;
      continueBtn.textContent = "Checking...";
      message.textContent = "";

      try {

        const wallet =
          await getCurrentWallet();

        const balance =
          Number(wallet.balance);

        if (!Number.isFinite(balance)) {
          throw new Error(
            "Your wallet balance is invalid."
          );
        }

        if (amount > balance) {
          throw new Error(
            `Insufficient balance. Available: ${formatPeso(balance)}`
          );
        }

        recipientWallet =
          await findWalletByPhone(
            normalizedRecipient
          );

        if (!recipientWallet) {
          throw new Error(
            "No PeraGo account was found for this mobile number."
          );
        }

        if (
          recipientWallet.uid ===
          currentUser.uid
        ) {
          throw new Error(
            "You cannot send money to yourself."
          );
        }

        confirmRecipient.replaceChildren();

        const recipientName = document.createElement("span");
        recipientName.style.display = "block";
        recipientName.textContent = recipientWallet.name || "Unknown User";

        const recipientPhone = document.createElement("small");
        recipientPhone.style.display = "block";
        recipientPhone.style.marginTop = "4px";
        recipientPhone.style.color = "#64748b";
        recipientPhone.textContent = recipientWallet.phone || normalizedRecipient;

        confirmRecipient.append(recipientName, recipientPhone);

        confirmAmount.textContent =
          formatPeso(amount);

        confirmBalance.textContent =
          formatPeso(balance);

        formSection.style.display = "none";
        confirmBox.style.display = "block";

      } catch (error) {

        console.error(
          "Send Money error:",
          error
        );

        message.textContent =
          error.message ||
          "Unable to continue.";

      } finally {

        continueBtn.disabled = false;
        continueBtn.textContent = "Continue";

      }
    });

    cancelBtn.addEventListener("click", () => {

      if (transferLocked) {
        return;
      }

      confirmBox.style.display = "none";
      formSection.style.display = "block";

      recipientWallet = null;
      message.textContent = "";

    });

    confirmBtn.addEventListener("click", async () => {

      if (transferLocked) {
        return;
      }

      if (!recipientWallet) {
        message.textContent =
          "Recipient account not found.";
        return;
      }

      transferLocked = true;

      confirmBtn.disabled = true;
      cancelBtn.disabled = true;
      confirmBtn.textContent = "Processing...";

      const amount =
        Number(amountInput.value);

      try {

        const requestId =
          await createTransferRequest(
            recipientWallet.uid,
            amount,
            normalizedRecipient
          );

        console.log(
          "Transfer request ID:",
          requestId
        );

        addTransaction({
          direction: "out",
          type: "send",
          title: "Sent Money",
          recipient: recipientWallet.name || recipientWallet.phone || normalizedRecipient,
          amount
        });

        confirmBtn.textContent =
          "✓ Transfer Complete";

        confirmBtn.style.background =
          "#16a34a";

        message.textContent =
          "Transfer completed successfully.";

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

      } catch (error) {

        console.error(
          "Transfer request error:",
          error
        );

        transferLocked = false;

        confirmBtn.disabled = false;
        cancelBtn.disabled = false;

        confirmBtn.textContent =
          "Confirm Transfer";

        message.textContent =
          error.message ||
          "Transfer request failed.";
      }
    });

  </script>

</body>
</html>
