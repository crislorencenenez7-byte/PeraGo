<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send Money - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    body { background:#f4f7fb; }
    .back-link {
      display:inline-block;
      margin-bottom:18px;
      color:#1677ff;
      text-decoration:none;
      font-weight:600;
    }
    .amount-input {
      width:100%;
      box-sizing:border-box;
      padding:16px;
      border:1px solid #dbe3ef;
      border-radius:12px;
      font-size:24px;
      font-weight:700;
      text-align:center;
      outline:none;
    }
    .amount-input:focus { border-color:#1677ff; }
    .confirm-box {
      display:none;
      margin-top:20px;
      padding:16px;
      border-radius:14px;
      background:#f1f6ff;
    }
    .confirm-row {
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin:8px 0;
    }
    .confirm-row strong { color:#111827; }
    .confirm-buttons {
      display:flex;
      gap:10px;
      margin-top:16px;
    }
    .cancel-btn {
      flex:1;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#e5e7eb;
      color:#374151;
      font-weight:700;
    }
    .confirm-btn {
      flex:1;
      padding:14px;
      border:0;
      border-radius:12px;
      background:#1677ff;
      color:white;
      font-weight:700;
    }
  </style>
</head>

<body>
  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Demo Wallet</p>
    </div>

    <div class="auth-card">

      <a class="back-link" href="index.html">← Back to Home</a>

      <div class="auth-heading">
        <h2>Send Money</h2>
        <p>Send demo funds to another mobile number.</p>
      </div>

      <div id="formSection">

        <div class="input-group">
          <label for="recipient">Recipient Mobile Number</label>
          <input
            type="tel"
            id="recipient"
            placeholder="9XXXXXXXXX"
            inputmode="numeric"
            maxlength="10"
          >
        </div>

        <div class="input-group">
          <label for="amount">Amount</label>
          <input
            class="amount-input"
            type="number"
            id="amount"
            min="1"
            step="0.01"
            inputmode="decimal"
            placeholder="0.00"
          >
        </div>

        <button class="primary-btn" id="continueBtn" type="button">
          Continue
        </button>

      </div>

      <div id="confirmBox" class="confirm-box">

        <h3>Confirm Transfer</h3>

        <div class="confirm-row">
          <span>Recipient</span>
          <strong id="confirmRecipient"></strong>
        </div>

        <div class="confirm-row">
          <span>Amount</span>
          <strong id="confirmAmount"></strong>
        </div>

        <div class="confirm-row">
          <span>Available Balance</span>
          <strong id="confirmBalance"></strong>
        </div>

        <div class="confirm-buttons">
          <button class="cancel-btn" id="cancelBtn" type="button">
            Cancel
          </button>

          <button class="confirm-btn" id="confirmBtn" type="button">
            Confirm
          </button>
        </div>

      </div>

      <div id="sendMessage" class="auth-message"></div>

    </div>

    <p class="footer-text">Demo only — no real money is sent.</p>

  </div>

  <script type="module">
    import {
      getBalance,
      setBalance,
      addTransaction,
      formatPeso
    } from "./wallet.js";

    const recipientInput = document.getElementById("recipient");
    const amountInput = document.getElementById("amount");

    const formSection = document.getElementById("formSection");
    const confirmBox = document.getElementById("confirmBox");

    const continueBtn = document.getElementById("continueBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const confirmBtn = document.getElementById("confirmBtn");

    const confirmRecipient =
      document.getElementById("confirmRecipient");

    const confirmAmount =
      document.getElementById("confirmAmount");

    const confirmBalance =
      document.getElementById("confirmBalance");

    const message =
      document.getElementById("sendMessage");

    continueBtn.addEventListener("click", () => {

      const recipient = recipientInput.value.trim();
      const amount = Number(amountInput.value);
      const balance = getBalance();

      if (!/^9\d{9}$/.test(recipient)) {
        message.textContent =
          "Enter a valid Philippine mobile number.";
        return;
      }

      if (!Number.isFinite(amount) || amount <= 0) {
        message.textContent =
          "Enter a valid amount.";
        return;
      }

      if (amount > balance) {
        message.textContent =
          "Insufficient balance. Available: " +
          formatPeso(balance);
        return;
      }

      confirmRecipient.textContent = "+63" + recipient;
      confirmAmount.textContent = formatPeso(amount);
      confirmBalance.textContent = formatPeso(balance);

      message.textContent = "";

      formSection.style.display = "none";
      confirmBox.style.display = "block";
    });

    cancelBtn.addEventListener("click", () => {
      confirmBox.style.display = "none";
      formSection.style.display = "block";
    });

    confirmBtn.addEventListener("click", () => {

      const recipient = recipientInput.value.trim();
      const amount = Number(amountInput.value);
      const balance = getBalance();

      if (amount > balance) {
        message.textContent =
          "Insufficient balance.";
        return;
      }

      setBalance(balance - amount);

      addTransaction({
        type: "send",
        title: "Send Money",
        amount: amount,
        direction: "out",
        recipient: "+63" + recipient
      });

      message.textContent =
        "Transfer successful! Sent " +
        formatPeso(amount) +
        " to +63" + recipient + ".";

      confirmBtn.disabled = true;

      setTimeout(() => {
        window.location.href = "index.html";
      }, 1000);
    });
  </script>
</body>
</html>
