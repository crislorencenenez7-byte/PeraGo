<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1769ff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <title>My QR — PeraGo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-page">
  <header class="app-header">
    <div class="app-header-row">
      <div class="app-brand">
        <div class="app-brand-mark">P</div>
        <div><div class="app-brand-name">PeraGo</div><div class="app-brand-sub">Your smart wallet</div></div>
      </div>
      <a class="app-profile" href="profile.html" aria-label="Profile">P</a>
    </div>
  </header>

  <main class="page-content">
    <div class="page-title-row">
      <button class="back-btn" type="button" onclick="history.back()" aria-label="Go back">‹</button>
      <div><h1 class="page-title">My QR</h1><p class="page-subtitle">Receive demo payments quickly.</p></div>
    </div>

    <section class="app-card qr-card">
      <div class="qr-box"><div class="qr-center">P</div></div>
      <h2>PeraGo QR</h2>
      <p class="demo-note">This QR is for the PeraGo demo wallet only. No real-money payment is processed.</p>
      <button class="primary-btn full-btn" type="button" onclick="alert('QR sharing will be added next.')">Share QR</button>
    </section>

    <div class="status-note" style="margin-top:13px">
      <span>▦</span><div><strong>Demo QR</strong> Use this screen to preview the PeraGo QR experience. Real QR payments are not processed.</div>
    </div>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-item" type="button" onclick="window.location.href='index.html'"><span>⌂</span><small>Home</small></button>
    <button class="nav-item" type="button" onclick="window.location.href='send-money.html'"><span>➤</span><small>Send</small></button>
    <button class="nav-item qr-main active" type="button"><span>▦</span><small>QR</small></button>
    <button class="nav-item" type="button" onclick="window.location.href='index.html#transactions'"><span>◷</span><small>History</small></button>
    <button class="nav-item" type="button" onclick="window.location.href='profile.html'"><span>●</span><small>Profile</small></button>
  </nav>
</div>
</body>
</html>
