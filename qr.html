<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1264e8">
  <title>PeraGo QR</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      background: #f4f7fb;
    }

    .qr-page {
      min-height: 100dvh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
    }

    .qr-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }

    .back-btn {
      border: 0;
      background: #fff;
      color: #1264e8;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(0,0,0,.06);
    }

    .qr-title h1 {
      margin: 0;
      font-size: 24px;
    }

    .qr-title p {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .qr-card {
      background: #fff;
      border-radius: 24px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,.07);
    }

    .qr-box {
      width: min(70vw, 260px);
      height: min(70vw, 260px);
      margin: 10px auto 24px;
      border: 10px solid #1264e8;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(45deg, #111 25%, transparent 25%) 0 0 / 24px 24px,
        linear-gradient(-45deg, #111 25%, transparent 25%) 0 0 / 24px 24px,
        linear-gradient(45deg, transparent 75%, #111 75%) 0 0 / 24px 24px,
        linear-gradient(-45deg, transparent 75%, #111 75%) 0 0 / 24px 24px,
        #fff;
    }

    .qr-center {
      width: 74px;
      height: 74px;
      border-radius: 18px;
      background: #1264e8;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 38px;
      font-weight: 800;
      border: 8px solid #fff;
    }

    .demo-note {
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }

    .primary-btn {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="qr-page">

    <div class="qr-top">
      <button class="back-btn" type="button" onclick="history.back()">‹</button>

      <div class="qr-title">
        <h1>My QR</h1>
        <p>Receive demo payments</p>
      </div>
    </div>

    <section class="qr-card">
      <div class="qr-box">
        <div class="qr-center">P</div>
      </div>

      <h2>PeraGo QR</h2>

      <p class="demo-note">
        This QR is for the PeraGo demo wallet only.
        No real-money payment is processed.
      </p>

      <button
        class="primary-btn"
        type="button"
        onclick="alert('QR sharing will be added next.')">
        Share QR
      </button>
    </section>

  </main>
<script type="module" src="update-timer.js"></script>
</body>
</html>
