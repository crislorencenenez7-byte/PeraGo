<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#1264e8"><title>PeraGo — Create Account</title>
<link rel="stylesheet" href="auth.css"></head>
<body><main class="auth-shell"><section class="auth-card">
<div class="brand"><b class="brand-p">P</b><span>Pera<span>Go</span></span></div>
<p class="eyebrow">GET STARTED</p><h1>Create your PeraGo account</h1>
<p class="subtitle">Set up your mobile number and 6-digit PIN.</p>
<form id="registerForm">
<label>Full Name</label><input id="name" type="text" placeholder="Your full name" required>
<label>Mobile Number</label><input id="mobile" type="tel" inputmode="numeric" maxlength="11" placeholder="09XXXXXXXXX" required>
<label>6-Digit PIN</label><div class="pin-wrap"><input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" required><button type="button" id="togglePin">Show</button></div>
<label>Confirm PIN</label><input id="confirmPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" required>
<button class="primary">Create Account</button><p class="message" id="message"></p></form>
<p class="switch">Already have an account? <a href="login.html">Login</a></p>
</section></main><script src="auth.js"></script></body></html>
