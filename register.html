<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>
  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Your simple digital wallet</p>
    </div>

    <div class="auth-card">

      <div class="auth-heading">
        <h2>Create Account</h2>
        <p>Register your email to get started.</p>
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="new-password"
        >
        <small>Password must be at least 6 characters.</small>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm Password</label>
        <input
          type="password"
          id="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
        >
      </div>

      <button class="primary-btn" id="registerBtn" type="button">
        Create Account
      </button>

      <div id="authMessage" class="auth-message"></div>

      <div class="divider"></div>

      <div style="text-align:center;margin-top:18px;">
        <button
          type="button"
          onclick="window.location.href='pin-lock.html'"
          style="border:0;background:transparent;color:#1264e8;font-weight:700;font-size:14px;cursor:pointer;"
        >
          Already have an account? Login
        </button>
      </div>

    </div>

    <p class="footer-text">
      By continuing, you agree to use PeraGo as a demo wallet.
    </p>

  </div>

  <script type="module">
    import { auth } from "./firebase-auth.js";

    const registerBtn = document.getElementById("registerBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const authMessage = document.getElementById("authMessage");

    registerBtn.addEventListener("click", async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      authMessage.textContent = "";

      if (!email) {
        authMessage.textContent = "Please enter your email address.";
        return;
      }

      if (!password) {
        authMessage.textContent = "Please enter a password.";
        return;
      }

      if (password.length < 6) {
        authMessage.textContent = "Password must be at least 6 characters.";
        return;
      }

      if (password !== confirmPassword) {
        authMessage.textContent = "Passwords do not match.";
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";

      const result = await window.registerWithEmail(email, password);

      if (!result.success) {
        authMessage.textContent = result.message;
        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";
        return;
      }

      authMessage.textContent = "Account created successfully.";

      setTimeout(() => {
        window.location.href = "set-pin.html";
      }, 700);
    });
  </script>

</body>
</html>
