<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <main class="auth-container">

    <div class="auth-card">

      <div class="auth-logo">
        <div class="logo-circle">P</div>
        <h1>PeraGo</h1>
        <p>Mas mabilis. Mas madali.</p>
      </div>

      <h2>Create Account</h2>
      <p class="subtitle">Register using your mobile number</p>

      <label for="phone">Mobile Number</label>

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="09XXXXXXXXX"
        inputmode="numeric"
        autocomplete="tel"
      >

      <button type="button" id="sendOtpBtn">
        Send OTP
      </button>

      <div id="recaptcha-container"></div>

      <div id="otpSection" style="display:none; margin-top:16px;">

        <label for="otp">6-Digit OTP</label>

        <input
          type="text"
          id="otp"
          name="otp"
          placeholder="Enter 6-digit OTP"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
        >

        <button
          type="button"
          id="verifyOtpBtn"
          style="display:none;"
        >
          Verify OTP
        </button>

      </div>

      <p id="authMessage"></p>

      <p class="switch-auth">
        Already have an account?
        <a href="login.html">Login</a>
      </p>

    </div>

  </main>

  <script type="module" src="auth.js"></script>

  <script>
    const otpInput = document.getElementById("otp");
    const otpSection = document.getElementById("otpSection");

    const observer = new MutationObserver(() => {
      if (otpInput && otpInput.style.display !== "none") {
        otpSection.style.display = "block";
      }
    });

    observer.observe(otpInput, {
      attributes: true,
      attributeFilter: ["style"]
    });
  </script>

</body>
</html>
