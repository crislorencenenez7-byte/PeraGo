<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1264e8">
  <title>Create Account - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    .email-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #eef5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .verify-note {
      margin: 16px 0;
      padding: 14px;
      border-radius: 15px;
      background: #eef5ff;
      color: #315b91;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .success {
      color: #16a34a;
    }
  </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Your simple digital wallet</p>
    </div>

    <div class="auth-card">

      <div class="email-icon">✉️</div>

      <div class="auth-heading">
        <h2>Create Account</h2>
        <p>Verify your email to get started.</p>
      </div>

      <div class="input-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Juan Dela Cruz"
          autocomplete="name"
        >
      </div>

      <div class="input-group">
        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="09XXXXXXXXX"
          maxlength="11"
          inputmode="numeric"
          autocomplete="tel"
        >
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>

      <div class="verify-note">
        📧 We'll send a secure verification link to your email.
      </div>

      <button class="primary-btn" id="sendEmailBtn" type="button">
        Send Verification Email
      </button>

      <div id="authMessage" class="auth-message"></div>

      <div class="divider"></div>

      <div style="text-align:center;margin-top:18px;">
        <button
          type="button"
          onclick="window.location.href='pin-lock.html'"
          style="border:0;background:transparent;color:#1264e8;font-weight:700;font-size:14px;cursor:pointer;"
        >
          Already have an account? Login
        </button>
      </div>

    </div>

    <p class="footer-text">
      By continuing, you agree to use PeraGo as a demo wallet.
    </p>

  </div>

  <script type="module">
    import "./firebase-auth.js";

    const fullNameInput = document.getElementById("fullName");
    const phoneInput = document.getElementById("phone");
    const emailInput = document.getElementById("email");
    const sendEmailBtn = document.getElementById("sendEmailBtn");
    const authMessage = document.getElementById("authMessage");

    async function finishVerification() {
      if (!window.completeEmailVerification) return;

      const result = await window.completeEmailVerification();

      if (result.success) {
        authMessage.className = "auth-message success";
        authMessage.textContent = "Email verified successfully!";

        setTimeout(() => {
          window.location.href = "set-pin.html";
        }, 700);
      }
    }

    finishVerification();

    sendEmailBtn.addEventListener("click", async () => {
      const fullName = fullNameInput.value.trim();
      const phone = phoneInput.value.trim();
      const email = emailInput.value.trim();

      if (!fullName) {
        authMessage.textContent = "Please enter your full name.";
        return;
      }

      if (!/^09\d{9}$/.test(phone)) {
        authMessage.textContent = "Please enter a valid Philippine mobile number.";
        return;
      }

      if (!email) {
        authMessage.textContent = "Please enter your email address.";
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        authMessage.textContent = "Please enter a valid email address.";
        return;
      }

      const normalizedPhone = "+63" + phone.substring(1);

      localStorage.setItem("perago_pending_name", fullName);
      localStorage.setItem("perago_pending_phone", normalizedPhone);

      sendEmailBtn.disabled = true;
      authMessage.className = "auth-message";
      authMessage.textContent = "Sending verification email...";

      const result = await window.sendEmailVerificationLink(email);

      if (result.success) {
        authMessage.className = "auth-message success";
        authMessage.textContent =
          "Verification email sent. Check your inbox and click the link.";
      } else {
        authMessage.textContent =
          "Failed to send email: " + result.message;
        sendEmailBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
