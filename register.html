<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Your simple digital wallet</p>
    </div>

    <div class="auth-card">

      <div class="auth-heading">
        <h2>Create Account</h2>
        <p>Register your mobile number to get started.</p>
      </div>

      <div class="input-group">
        <label for="phone">Mobile Number</label>

        <div class="input-box">
          <span class="country-code">🇵🇭 +63</span>
          <input
            type="tel"
            id="phone"
            placeholder="9XXXXXXXXX"
            inputmode="numeric"
            autocomplete="tel"
          >
        </div>

        <small>Example: 9171234567</small>
      </div>

      <div id="recaptcha-container"></div>

      <button class="primary-btn" id="sendOtpBtn" type="button">
        Send OTP
      </button>

      <div id="otpSection" class="otp-section">

        <div class="input-group">
          <label for="otp">Verification Code</label>

          <input
            class="otp-input"
            type="text"
            id="otp"
            placeholder="000000"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
          >

          <small>Enter the 6-digit code sent to your phone.</small>
        </div>

        <button
          class="primary-btn"
          id="verifyOtpBtn"
          type="button"
        >
          Verify & Continue
        </button>

      </div>

      <div id="authMessage" class="auth-message"></div>

      <div class="divider">
        <span>Already have an account?</span>
      </div>

      </a>

    </div>

    <p class="footer-text">
      By continuing, you agree to use PeraGo as a demo wallet.
    </p>

  </div>

  <script type="module" src="auth.js"></script>

  <script>
    const otpSection = document.getElementById("otpSection");
    const otpInput = document.getElementById("otp");

    otpSection.style.display = "none";

    const observer = new MutationObserver(() => {
      if (otpInput.style.display !== "none") {
        otpSection.style.display = "block";
      }
    });

    observer.observe(otpInput, {
      attributes: true,
      attributeFilter: ["style"]
    });
  </script>

</body>
</html>
