<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1264e8">
  <title>Create Account - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
  <style>
    .email-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: #eef5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .verify-note {
      margin: 16px 0;
      padding: 14px;
      border-radius: 15px;
      background: #eef5ff;
      color: #315b91;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }

    .success {
      color: #16a34a;
    }
  </style>
</head>

<body>

<style id="perago-premium-1750">
:root{
  --pg-bg:#f4f7fb;--pg-card:#ffffff;--pg-text:#101828;--pg-muted:#667085;
  --pg-border:#e7ecf3;--pg-accent:#0b6bff;--pg-accent2:#13a8ff;
  --pg-shadow:0 14px 40px rgba(16,24,40,.08);
}
body{background:var(--pg-bg)!important;color:var(--pg-text)!important;}
.pg-brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;margin:0 0 18px;border-radius:20px;background:linear-gradient(135deg,#0b6bff,#13a8ff);color:#fff;box-shadow:0 12px 30px rgba(11,107,255,.20)}
.pg-brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px}
.pg-logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:21px}
.pg-brand small{display:block;font-weight:500;opacity:.82;font-size:11px;margin-top:1px}
.pg-profile-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b6bff;font-weight:800;text-decoration:none}
.pg-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;margin:16px 0 22px;border:1px solid var(--pg-border);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--pg-shadow)}
.pg-tab{min-height:58px;border-radius:16px;text-decoration:none;color:var(--pg-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;transition:.18s}
.pg-tab:hover{background:#f1f6ff;color:#0b6bff}
.pg-tab-icon{font-size:20px;line-height:1;font-weight:900}
.pg-tab[href="__CURRENT__"]{background:#eaf2ff;color:#0b6bff}
.pg-page-title{font-weight:900;letter-spacing:-.4px}
.pg-section-card{background:var(--pg-card);border:1px solid var(--pg-border);border-radius:24px;box-shadow:var(--pg-shadow)}
@media(max-width:520px){.pg-brandbar{padding:12px 14px}.pg-nav{gap:5px;padding:7px}.pg-tab{min-height:54px}.pg-tab-icon{font-size:18px}}
</style>

<div class="pg-brandbar">
  <div class="pg-brand">
    <div class="pg-logo">₱</div>
    <div>PeraGo<small>Your smart wallet</small></div>
  </div>
  <a class="pg-profile-dot" href="profile.html" aria-label="Profile">P</a>
</div>
<nav class="pg-nav" aria-label="PeraGo navigation">
  <a class="pg-tab" href="index.html" aria-label="Home"><span class="pg-tab-icon">⌂</span><span>Home</span></a><a class="pg-tab" href="send-money.html" aria-label="Send"><span class="pg-tab-icon">↗</span><span>Send</span></a><a class="pg-tab" href="qr.html" aria-label="QR"><span class="pg-tab-icon">▣</span><span>QR</span></a><a class="pg-tab" href="profile.html" aria-label="Profile"><span class="pg-tab-icon">◉</span><span>Profile</span></a>
</nav>

  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Your simple digital wallet</p>
    </div>

    <div class="auth-card">

      <div class="email-icon">✉️</div>

      <div class="auth-heading">
        <h2>Create Account</h2>
        <p>Verify your email to get started.</p>
      </div>

      <div class="input-group">
        <label for="fullName">Full Name</label>
        <input
          type="text"
          id="fullName"
          placeholder="Juan Dela Cruz"
          autocomplete="name"
        >
      </div>

      <div class="input-group">
        <label for="phone">Mobile Number</label>
        <input
          type="tel"
          id="phone"
          placeholder="09XXXXXXXXX"
          maxlength="11"
          inputmode="numeric"
          autocomplete="tel"
        >
      </div>

      <div class="input-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
        >
      </div>

      <div class="verify-note">
        📧 We'll send a secure verification link to your email.
      </div>

      <button class="primary-btn" id="sendEmailBtn" type="button">
        Send Verification Email
      </button>

      <div id="authMessage" class="auth-message"></div>

      <div class="divider"></div>

      <div style="text-align:center;margin-top:18px;">
        <button
          type="button"
          onclick="window.location.href='pin-lock.html'"
          style="border:0;background:transparent;color:#1264e8;font-weight:700;font-size:14px;cursor:pointer;"
        >
          Already have an account? Login
        </button>
      </div>

    </div>

    <p class="footer-text">
      By continuing, you agree to use PeraGo as a demo wallet.
    </p>

  </div>

  <script type="module">
    import "./firebase-auth.js";

    const fullNameInput = document.getElementById("fullName");
    const phoneInput = document.getElementById("phone");
    const emailInput = document.getElementById("email");
    const sendEmailBtn = document.getElementById("sendEmailBtn");
    const authMessage = document.getElementById("authMessage");

    async function finishVerification() {
      if (!window.completeEmailVerification) return;

      const result = await window.completeEmailVerification();

      if (result.success) {
        authMessage.className = "auth-message success";
        authMessage.textContent = "Email verified successfully!";

        setTimeout(() => {
          window.location.href = "set-pin.html";
        }, 700);
      }
    }

    finishVerification();

    sendEmailBtn.addEventListener("click", async () => {
      const fullName = fullNameInput.value.trim();
      const phone = phoneInput.value.trim();
      const email = emailInput.value.trim();

      if (!fullName) {
        authMessage.textContent = "Please enter your full name.";
        return;
      }

      if (!/^09\d{9}$/.test(phone)) {
        authMessage.textContent = "Please enter a valid Philippine mobile number.";
        return;
      }

      if (!email) {
        authMessage.textContent = "Please enter your email address.";
        return;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        authMessage.textContent = "Please enter a valid email address.";
        return;
      }

      const normalizedPhone = "+63" + phone.substring(1);

      localStorage.setItem("perago_pending_name", fullName);
      localStorage.setItem("perago_pending_phone", normalizedPhone);

      sendEmailBtn.disabled = true;
      authMessage.className = "auth-message";
      authMessage.textContent = "Sending verification email...";

      const result = await window.sendEmailVerificationLink(email);

      if (result.success) {
        authMessage.className = "auth-message success";
        authMessage.textContent =
          "Verification email sent. Check your inbox and click the link.";
      } else {
        authMessage.textContent =
          "Failed to send email: " + result.message;
        sendEmailBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
