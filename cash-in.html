<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cash In - PeraGo</title>
  <link rel="stylesheet" href="auth.css">

  <style>
    body {
      background: #f4f7fb;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #1677ff;
      text-decoration: none;
      font-weight: 600;
    }

    .amount-input {
      width: 100%;
      box-sizing: border-box;
      padding: 16px;
      border: 1px solid #dbe3ef;
      border-radius: 12px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      outline: none;
    }

    .amount-input:focus {
      border-color: #1677ff;
    }
  </style>
</head>

<body>

  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Demo Wallet</p>
    </div>

    <div class="auth-card">

      <a class="back-link" href="index.html">← Back to Home</a>

      <div class="auth-heading">
        <h2>Cash In</h2>
        <p>Add demo funds to your PeraGo wallet.</p>
      </div>

      <div class="input-group">
        <label for="amount">Amount</label>

        <input
          class="amount-input"
          type="number"
          id="amount"
          min="1"
          step="0.01"
          inputmode="decimal"
          placeholder="0.00"
        >
      </div>

      <button class="primary-btn" id="cashInBtn" type="button">
        Add Demo Funds
      </button>

      <div id="cashInMessage" class="auth-message"></div>

    </div>

    <p class="footer-text">
      Demo only — no real money is added.
    </p>

  </div>

  <script type="module">
    import {
      getBalance,
      setBalance,
      addTransaction,
      formatPeso
    } from "./wallet.js";

    const amountInput = document.getElementById("amount");
    const cashInBtn = document.getElementById("cashInBtn");
    const message = document.getElementById("cashInMessage");

    cashInBtn.addEventListener("click", () => {

      const amount = Number(amountInput.value);

      if (!Number.isFinite(amount) || amount <= 0) {
        message.textContent = "Enter a valid amount.";
        return;
      }

      const currentBalance = getBalance();
      const newBalance = currentBalance + amount;

      setBalance(newBalance);

      addTransaction({
        type: "cash_in",
        title: "Cash In",
        amount: amount,
        direction: "in"
      });

      message.textContent =
        "Added " + formatPeso(amount) + " to your demo wallet.";

      amountInput.value = "";

      setTimeout(() => {
        window.location.href = "index.html";
      }, 900);
    });
  </script>

</body>
</html>
