<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set PIN - PeraGo</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Secure your wallet</p>
    </div>

    <div class="auth-card">

      <div class="auth-heading">
        <h2>Create your PIN</h2>
        <p>Set a 4-digit PIN for your PeraGo demo wallet.</p>
      </div>

      <div class="input-group">
        <label for="pin">4-Digit PIN</label>
        <input
          class="otp-input"
          type="password"
          id="pin"
          maxlength="4"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••"
        >
      </div>

      <div class="input-group">
        <label for="confirmPin">Confirm PIN</label>
        <input
          class="otp-input"
          type="password"
          id="confirmPin"
          maxlength="4"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••"
        >
      </div>

      <button class="primary-btn" id="savePinBtn" type="button">
        Continue
      </button>

      <div id="pinMessage" class="auth-message"></div>

    </div>

    <p class="footer-text">
      PeraGo is a demo wallet. Do not use real financial information.
    </p>

  </div>

  <script type="module">
    import { savePin } from "./pin.js";

    const pin = document.getElementById("pin");
    const confirmPin = document.getElementById("confirmPin");
    const button = document.getElementById("savePinBtn");
    const message = document.getElementById("pinMessage");

    button.addEventListener("click", async () => {

      const pinValue = pin.value.trim();
      const confirmValue = confirmPin.value.trim();

      if (!/^\d{4}$/.test(pinValue)) {
        message.textContent = "PIN must be exactly 4 digits.";
        return;
      }

      if (pinValue !== confirmValue) {
        message.textContent = "PINs do not match.";
        return;
      }

      try {
        await savePin(pinValue);
        message.textContent = "PIN created successfully!";
      } catch (error) {
        console.error(error);
        message.textContent = "Failed to save PIN. Please try again.";
        return;
      }

      setTimeout(() => {
        window.location.href = "pin-lock.html";
      }, 700);
    });
  </script>

<script type="module" src="update-timer.js"></script>
</body>
</html>
