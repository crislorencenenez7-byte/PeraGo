<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1264e8">
  <title>Enter PIN - PeraGo</title>

  <link rel="stylesheet" href="auth.css">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: #f4f7fb;
    }

    .pin-page {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 18px;
    }

    .pin-brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .pin-brand .brand-icon {
      margin: 0 auto 12px;
    }

    .pin-brand h1 {
      margin: 0;
      font-size: 28px;
    }

    .pin-brand p {
      margin: 6px 0 0;
      color: #64748b;
      font-size: 14px;
    }

    .pin-card {
      width: 100%;
      max-width: 390px;
      background: #fff;
      border-radius: 28px;
      padding: 28px 20px 24px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
      text-align: center;
    }

    .pin-card h2 {
      margin: 0;
      font-size: 22px;
    }

    .pin-card .subtitle {
      margin: 7px 0 22px;
      color: #64748b;
      font-size: 14px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 13px;
      margin: 18px 0 24px;
    }

    .pin-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #dbe3ef;
      transition: .15s ease;
    }

    .pin-dot.filled {
      background: #1264e8;
      transform: scale(1.05);
    }

    .pin-message {
      min-height: 22px;
      margin-bottom: 14px;
      color: #dc2626;
      font-size: 13px;
      font-weight: 600;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 320px;
      margin: 0 auto;
    }

    .key {
      height: 62px;
      border: 0;
      border-radius: 18px;
      background: #f4f7fb;
      color: #172033;
      font-size: 24px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key:active {
      transform: scale(.94);
      background: #e7eefb;
    }

    .key.zero {
      grid-column: 2;
    }

    .key.delete {
      grid-column: 3;
      background: transparent;
      color: #1264e8;
      font-size: 24px;
    }

    .key.delete:active {
      background: #eef5ff;
    }

    .footer-text {
      margin-top: 22px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>

<body>

<style id="perago-premium-1750">
:root{
  --pg-bg:#f4f7fb;--pg-card:#ffffff;--pg-text:#101828;--pg-muted:#667085;
  --pg-border:#e7ecf3;--pg-accent:#0b6bff;--pg-accent2:#13a8ff;
  --pg-shadow:0 14px 40px rgba(16,24,40,.08);
}
body{background:var(--pg-bg)!important;color:var(--pg-text)!important;}
.pg-brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;margin:0 0 18px;border-radius:20px;background:linear-gradient(135deg,#0b6bff,#13a8ff);color:#fff;box-shadow:0 12px 30px rgba(11,107,255,.20)}
.pg-brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px}
.pg-logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:21px}
.pg-brand small{display:block;font-weight:500;opacity:.82;font-size:11px;margin-top:1px}
.pg-profile-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b6bff;font-weight:800;text-decoration:none}
.pg-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;margin:16px 0 22px;border:1px solid var(--pg-border);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--pg-shadow)}
.pg-tab{min-height:58px;border-radius:16px;text-decoration:none;color:var(--pg-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;transition:.18s}
.pg-tab:hover{background:#f1f6ff;color:#0b6bff}
.pg-tab-icon{font-size:20px;line-height:1;font-weight:900}
.pg-tab[href="__CURRENT__"]{background:#eaf2ff;color:#0b6bff}
.pg-page-title{font-weight:900;letter-spacing:-.4px}
.pg-section-card{background:var(--pg-card);border:1px solid var(--pg-border);border-radius:24px;box-shadow:var(--pg-shadow)}
@media(max-width:520px){.pg-brandbar{padding:12px 14px}.pg-nav{gap:5px;padding:7px}.pg-tab{min-height:54px}.pg-tab-icon{font-size:18px}}
</style>

<div class="pg-brandbar">
  <div class="pg-brand">
    <div class="pg-logo">₱</div>
    <div>PeraGo<small>Your smart wallet</small></div>
  </div>
  <a class="pg-profile-dot" href="profile.html" aria-label="Profile">P</a>
</div>
<nav class="pg-nav" aria-label="PeraGo navigation">
  <a class="pg-tab" href="index.html" aria-label="Home"><span class="pg-tab-icon">⌂</span><span>Home</span></a><a class="pg-tab" href="send-money.html" aria-label="Send"><span class="pg-tab-icon">↗</span><span>Send</span></a><a class="pg-tab" href="qr.html" aria-label="QR"><span class="pg-tab-icon">▣</span><span>QR</span></a><a class="pg-tab" href="profile.html" aria-label="Profile"><span class="pg-tab-icon">◉</span><span>Profile</span></a>
</nav>


  <main class="pin-page">

    <div class="pin-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Your digital wallet</p>
    </div>

    <section class="pin-card">

      <h2>Enter your PIN</h2>
      <p class="subtitle">Enter your 4-digit PIN to continue.</p>

      <div class="pin-dots" id="pinDots">
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
        <span class="pin-dot"></span>
      </div>

      <div class="pin-message" id="pinMessage"></div>



      <button id="forgotPinBtn" type="button" onclick="window.location.href='forgot-pin.html'" style="margin:4px 0 18px;border:0;background:transparent;color:#1264e8;font-weight:700;font-size:14px;cursor:pointer;">Forgot PIN?</button>

<div id="account-navigation" style="
  width:100%;
  text-align:center;
  margin:20px 0;
  padding:0 16px;
  box-sizing:border-box;
">
  <button
    id="registerBtn"
    type="button"
    onclick="location.href='register.html'"
    style="
      display:inline-block;
      border:0;
      background:none;
      color:#1264e8;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      padding:12px;
    "
  >Don't have an account? Register</button>
</div>

      <div class="keypad">

        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>

        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>

        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>

        <button class="key zero" data-key="0">0</button>

        <button class="key delete" id="deleteBtn" type="button">
          ⌫
        </button>

      </div>

    </section>



    <p class="footer-text">
      PeraGo Demo Wallet
    </p>

  </main>

  

<script type="module">

    import { checkPin } from "./pin.js";

    let enteredPin = "";

    const dots = document.querySelectorAll(".pin-dot");
    const message = document.getElementById("pinMessage");
    const deleteBtn = document.getElementById("deleteBtn");

    function updateDots() {

      dots.forEach((dot, index) => {
        dot.classList.toggle(
          "filled",
          index < enteredPin.length
        );
      });

    }

    function clearPin() {
      enteredPin = "";
      updateDots();
    }

    async function unlock() {

      if (enteredPin.length !== 4) {
        return;
      }

      if (await checkPin(enteredPin)) {

        message.style.color = "#16a34a";
        message.textContent = "Unlocked!";

        sessionStorage.setItem(
          "perago_unlocked",
          "true"
        );

        setTimeout(() => {
          window.location.href = "index.html";
        }, 350);

      } else {

        message.style.color = "#dc2626";
        message.textContent = "Incorrect PIN.";

        clearPin();

      }

    }

    document.querySelectorAll("[data-key]").forEach(button => {

      button.addEventListener("click", () => {

        if (enteredPin.length >= 4) {
          return;
        }

        enteredPin += button.dataset.key;

        message.textContent = "";

        updateDots();

        if (enteredPin.length === 4) {
          setTimeout(unlock, 120);
        }

      });

    });

    deleteBtn.addEventListener("click", () => {

      if (enteredPin.length > 0) {
        enteredPin = enteredPin.slice(0, -1);
        message.textContent = "";
        updateDots();
      }

    });

  </script>




</body>
</html>
