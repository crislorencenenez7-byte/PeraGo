<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change PIN - PeraGo</title>
  <link rel="stylesheet" href="auth.css">

  <style>
    body {
      background: #f4f7fb;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 18px;
      color: #1677ff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

<style id="perago-premium-1750">
:root{
  --pg-bg:#f4f7fb;--pg-card:#ffffff;--pg-text:#101828;--pg-muted:#667085;
  --pg-border:#e7ecf3;--pg-accent:#0b6bff;--pg-accent2:#13a8ff;
  --pg-shadow:0 14px 40px rgba(16,24,40,.08);
}
body{background:var(--pg-bg)!important;color:var(--pg-text)!important;}
.pg-brandbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 18px;margin:0 0 18px;border-radius:20px;background:linear-gradient(135deg,#0b6bff,#13a8ff);color:#fff;box-shadow:0 12px 30px rgba(11,107,255,.20)}
.pg-brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.2px}
.pg-logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);font-weight:900;font-size:21px}
.pg-brand small{display:block;font-weight:500;opacity:.82;font-size:11px;margin-top:1px}
.pg-profile-dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b6bff;font-weight:800;text-decoration:none}
.pg-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;margin:16px 0 22px;border:1px solid var(--pg-border);border-radius:22px;background:rgba(255,255,255,.9);box-shadow:var(--pg-shadow)}
.pg-tab{min-height:58px;border-radius:16px;text-decoration:none;color:var(--pg-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;transition:.18s}
.pg-tab:hover{background:#f1f6ff;color:#0b6bff}
.pg-tab-icon{font-size:20px;line-height:1;font-weight:900}
.pg-tab[href="__CURRENT__"]{background:#eaf2ff;color:#0b6bff}
.pg-page-title{font-weight:900;letter-spacing:-.4px}
.pg-section-card{background:var(--pg-card);border:1px solid var(--pg-border);border-radius:24px;box-shadow:var(--pg-shadow)}
@media(max-width:520px){.pg-brandbar{padding:12px 14px}.pg-nav{gap:5px;padding:7px}.pg-tab{min-height:54px}.pg-tab-icon{font-size:18px}}
</style>

<div class="pg-brandbar">
  <div class="pg-brand">
    <div class="pg-logo">₱</div>
    <div>PeraGo<small>Your smart wallet</small></div>
  </div>
  <a class="pg-profile-dot" href="profile.html" aria-label="Profile">P</a>
</div>
<nav class="pg-nav" aria-label="PeraGo navigation">
  <a class="pg-tab" href="index.html" aria-label="Home"><span class="pg-tab-icon">⌂</span><span>Home</span></a><a class="pg-tab" href="send-money.html" aria-label="Send"><span class="pg-tab-icon">↗</span><span>Send</span></a><a class="pg-tab" href="qr.html" aria-label="QR"><span class="pg-tab-icon">▣</span><span>QR</span></a><a class="pg-tab" href="profile.html" aria-label="Profile"><span class="pg-tab-icon">◉</span><span>Profile</span></a>
</nav>


  <div class="auth-page">

    <div class="auth-brand">
      <div class="brand-icon">P</div>
      <h1>PeraGo</h1>
      <p>Account security</p>
    </div>

    <div class="auth-card">

      <a class="back-link" href="profile.html">← Back to Profile</a>

      <div class="auth-heading">
        <h2>Change PIN</h2>
        <p>Update your 6-digit PeraGo PIN.</p>
      </div>

      <div class="input-group">
        <label for="currentPin">Current PIN</label>
        <input
          class="otp-input"
          type="password"
          id="currentPin"
          maxlength="6"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••••"
        >
      </div>

      <div class="input-group">
        <label for="newPin">New PIN</label>
        <input
          class="otp-input"
          type="password"
          id="newPin"
          maxlength="6"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••••"
        >
      </div>

      <div class="input-group">
        <label for="confirmPin">Confirm New PIN</label>
        <input
          class="otp-input"
          type="password"
          id="confirmPin"
          maxlength="6"
          inputmode="numeric"
          autocomplete="off"
          placeholder="••••••"
        >
      </div>

      <button class="primary-btn" id="changePinBtn" type="button">
        Change PIN
      </button>

      <div id="pinMessage" class="auth-message"></div>

    </div>

    <p class="footer-text">
      PeraGo Demo Wallet
    </p>

  </div>

  <script type="module">
    import { checkPin, savePin } from "./pin.js";

    const currentPin = document.getElementById("currentPin");
    const newPin = document.getElementById("newPin");
    const confirmPin = document.getElementById("confirmPin");
    const button = document.getElementById("changePinBtn");
    const message = document.getElementById("pinMessage");

    button.addEventListener("click", async () => {

      const current = currentPin.value.trim();
      const newValue = newPin.value.trim();
      const confirmValue = confirmPin.value.trim();

      if (!/^\d{6}$/.test(current)) {
        message.textContent = "Enter your current 6-digit PIN.";
        return;
      }

      if (!(await checkPin(current))) {
        message.textContent = "Current PIN is incorrect.";
        return;
      }

      if (!/^\d{6}$/.test(newValue)) {
        message.textContent = "New PIN must be exactly 6 digits.";
        return;
      }

      if (newValue !== confirmValue) {
        message.textContent = "New PINs do not match.";
        return;
      }

      if (current === newValue) {
        message.textContent = "New PIN must be different from your current PIN.";
        return;
      }

      try {
        await savePin(newValue);
      } catch (error) {
        console.error(error);
        message.textContent = "Failed to save PIN. Please try again.";
        return;
      }

      message.textContent = "PIN changed successfully.";

      currentPin.value = "";
      newPin.value = "";
      confirmPin.value = "";

      setTimeout(() => {
        window.location.href = "profile.html";
      }, 800);
    });
  </script>

</body>
</html>
