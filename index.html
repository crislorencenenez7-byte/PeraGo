<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <div class="app-shell">
    <header class="hero">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <div class="brand-name">Pera<span>Go</span></div>
            <div class="tagline">Mas mabilis. Mas madali.</div>
          </div>
        </div>

        <div class="top-actions">
          <button class="icon-btn" aria-label="Notifications">🔔<span class="dot"></span></button>

      </div>

      <section class="balance-card">
        <div>
          <p class="balance-label">Available Balance</p>

          <button class="balance-toggle" id="toggleBalance">◉ View Balance</button>
        </div>
        <div class="wallet-icon">₱</div>
      </section>
    </header>

    <main>
      <section style="padding: 0 16px 14px;">
        <button id="installAppBtn" type="button" style="display:none;" style="display:none;" style="width:100%;padding:14px;border:0;border-radius:14px;background:#1264e8;color:#fff;font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(18,100,232,.22);cursor:pointer;">📲 Install PeraGo</button>
      </section>
      <section class="quick-actions">
        <button class="action" data-action="Send Money" onclick="window.location.href='send-money.html'">
          <span class="action-icon blue">➤</span><span>Send Money</span>
        </button>
        <button class="action" data-action="Scan QR" onclick="window.location.href='qr.html'">
          <span class="action-icon purple">▦</span><span>Scan QR</span>
        </button>
        <button class="action" data-action="Cash In" onclick="window.location.href='cash-in.html'">
          <span class="action-icon orange">▣</span><span>Cash In</span>
        </button>
      </section>

      <section class="card transactions-card">
        <div class="section-heading">
          <h2>Recent Transactions</h2>
          <button id="seeAll">See All ›</button>
        </div>
        <div id="transactions"></div>
      </section>

      <section class="qr-banner">
        <div class="qr-symbol">▦</div>
        <div>
          <h2>Pay with QR</h2>
          <p>Fast. Safe. Convenient.</p>
        </div>
        <button id="learnMore">Learn More ›</button>
      </section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-page="Home"><span>⌂</span><small>Home</small></button>
      <button class="nav-item" data-page="Send" onclick="window.location.href='send-money.html'"><span>➤</span><small>Send</small></button>
      <button class="nav-item qr-main" data-page="QR" onclick="window.location.href='qr.html'"><span>▦</span><small>QR</small></button>
      <button class="nav-item" data-page="Transactions"><span>◷</span><small>Transactions</small></button>
      <button class="nav-item" data-page="Profile" onclick="window.location.href='profile.html'"><span>♙</span><small>Profile</small></button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
  <script type="module" src="session.js"></script>

<script>
  if (sessionStorage.getItem("perago_unlocked") !== "true") {
    window.location.replace("pin-lock.html");
  }
</script>

<div style="padding: 20px;">
  <button
    id="logoutBtn"
    type="button"
    onclick="peragoLogout()"
    style="
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #f1f5f9;
      color: #dc2626;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    "
  >
    Logout
  </button>
</div>



<script>
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("installAppBtn");

  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredInstallPrompt = event;
    if (installBtn) installBtn.style.display = "block";
  });

  installBtn?.addEventListener("click", async () => {
    if (!deferredInstallPrompt) {
      alert("PeraGo cannot be installed from this browser yet. Try Chrome menu ⋮ → Install app or Add to Home screen.");
      return;
    }

    deferredInstallPrompt.prompt();
    const result = await deferredInstallPrompt.userChoice;
    console.log("Install result:", result.outcome);
    deferredInstallPrompt = null;
  });

  window.addEventListener("appinstalled", () => {
    installBtn?.remove();
  });
</script>
<script>
  const installButton = document.getElementById("installAppBtn");
  const isInstalledApp = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

  if (isInstalledApp && installButton) {
    installButton.style.display = "none";
  }
</script>
<script type="module">
  import { getWalletProfile, auth } from "./wallet-firestore.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  const balanceElement = document.getElementById("balance");

  onAuthStateChanged(auth, async (user) => {
    if (!user || !balanceElement) return;

    try {
      const wallet = await getWalletProfile(user.uid);

      if (wallet) {
        const balance = Number(wallet.balance || 0);
        balanceElement.textContent = balance.toLocaleString("en-PH", {
          style: "currency",
          currency: "PHP"
        });
      }
    } catch (error) {
      console.error("Failed to load wallet:", error);
    }
  });
</script>
</body>
</html>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("PeraGo PWA ready"))
        .catch(error => console.error("PWA error:", error));
    });
  }
</script>
