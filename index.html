<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b4fd7">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <title>PeraGo — Wallet</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-body">
  <div class="app-shell">
    <header class="home-hero">
      <div class="home-topbar">
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>
            <div class="brand-name">Pera<span>Go</span></div>
            <div class="tagline">Mas mabilis. Mas madali.</div>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" aria-label="Notifications">♢<span class="dot"></span></button>
          <button class="avatar" type="button" aria-label="Profile" onclick="window.location.href='profile.html'">●</button>
        </div>
      </div>

      <div class="welcome-row">
        <div>
          <span class="eyebrow">YOUR DIGITAL WALLET</span>
          <h1>Good to see you.</h1>
          <p>Manage your money in a few taps.</p>
        </div>
        <div class="status-pill"><span></span> Active</div>
      </div>

      <section class="balance-card">
        <div class="balance-head">
          <span>Available Balance</span>
          <span class="balance-chip">PHP</span>
        </div>
        <div class="balance-value-row">
          <h2 id="balance">₱0.00</h2>
          <div class="wallet-icon">₱</div>
        </div>
        <button class="balance-toggle" id="toggleBalance" type="button">◉ Hide balance</button>
        <div class="balance-footer">
          <span>Demo wallet</span>
          <span>● Ready to use</span>
        </div>
      </section>
    </header>

    <main class="home-main">
      <section class="quick-actions">
        <div class="section-kicker">QUICK ACTIONS</div>
        <div class="action-grid">
          <button class="action" type="button" onclick="window.location.href='send-money.html'">
            <span class="action-icon blue">➤</span>
            <span>Send Money</span>
            <small>Transfer</small>
          </button>
          <button class="action" type="button" onclick="window.location.href='qr.html'">
            <span class="action-icon purple">▦</span>
            <span>Scan QR</span>
            <small>Pay & receive</small>
          </button>
          <button class="action" type="button" onclick="window.location.href='profile.html'">
            <span class="action-icon green">●</span>
            <span>My Profile</span>
            <small>Account</small>
          </button>
          <button class="action" type="button" id="historyAction">
            <span class="action-icon orange">◷</span>
            <span>History</span>
            <small>Activity</small>
          </button>
        </div>
      </section>

      <section class="card transactions-card">
        <div class="section-heading">
          <div>
            <span class="section-kicker">WALLET ACTIVITY</span>
            <h2>Recent Transactions</h2>
          </div>
          <button id="seeAll" type="button">See all <span>›</span></button>
        </div>
        <div id="transactions"></div>
      </section>

      <section class="qr-banner">
        <div class="qr-symbol">▦</div>
        <div class="qr-copy">
          <span class="section-kicker">FAST CHECKOUT</span>
          <h2>Pay with QR</h2>
          <p>Simple, quick and convenient.</p>
        </div>
        <button id="learnMore" type="button">Open <span>›</span></button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button" data-page="Home">
        <span>⌂</span><small>Home</small>
      </button>
      <button class="nav-item" type="button" data-page="Send" onclick="window.location.href='send-money.html'">
        <span>➤</span><small>Send</small>
      </button>
      <button class="nav-item qr-main" type="button" data-page="QR" onclick="window.location.href='qr.html'">
        <span>▦</span><small>QR</small>
      </button>
      <button class="nav-item" type="button" data-page="Transactions">
        <span>◷</span><small>History</small>
      </button>
      <button class="nav-item" type="button" data-page="Profile" onclick="window.location.href='profile.html'">
        <span>●</span><small>Profile</small>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
  <script type="module" src="session.js"></script>
  <script type="module" src="logout.js"></script>

  <script>
    if (sessionStorage.getItem("perago_unlocked") !== "true") {
      window.location.replace("pin-lock.html");
    }
  </script>

  <script>
    let deferredInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
    });
  </script>

  <script type="module">
    import { getWalletProfile, auth } from "./wallet-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    const balanceElement = document.getElementById("balance");
    let currentBalance = 0;
    let balanceHidden = false;

    function renderBalance() {
      balanceElement.textContent = balanceHidden
        ? "₱ ••••"
        : currentBalance.toLocaleString("en-PH", {
            style: "currency",
            currency: "PHP"
          });
    }

    document.getElementById("toggleBalance")?.addEventListener("click", (event) => {
      balanceHidden = !balanceHidden;
      renderBalance();
      event.currentTarget.textContent = balanceHidden ? "◉ Show balance" : "◉ Hide balance";
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user || !balanceElement) return;
      try {
        const wallet = await getWalletProfile(user.uid);
        currentBalance = Number(wallet?.balance ?? 0);
        if (!Number.isFinite(currentBalance)) currentBalance = 0;
        renderBalance();
      } catch (error) {
        console.error("Failed to load wallet:", error);
        balanceElement.textContent = "₱0.00";
      }
    });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .then(() => console.log("PeraGo PWA ready"))
          .catch(error => console.error("PWA error:", error));
      });
    }
  </script>
<script type="module" src="update-timer.js"></script>
</body>
</html>
